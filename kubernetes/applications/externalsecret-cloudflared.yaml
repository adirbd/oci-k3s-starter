# Makes the tunnel token arrive from OCI Vault instead of your laptop. RUNGS 2 + 4.
#
# ⚠ NOT DEPLOYED UNTIL YOU MOVE IT into kubernetes/applications/, and it does nothing
# without BOTH rungs: rung 2 creates the tunnel (so Terraform has a token to store), and
# rung 4 creates the vault, the instance-principal IAM and the ClusterSecretStore.
#
# WHY IT EXISTS. Without it, the connector's Secret is created by hand with `kubectl create
# secret`, which means a rebuilt cluster has no Secret and the connector CrashLoops until a
# human re-runs that command. This closes the loop: the value lives in the vault, the box
# proves its own identity to read it, and the Secret is recreated on its own.
#
# ⚠ THE KEY NAME FOLLOWS instance_name. terraform/vault.tf stores the token as
# "${instance_name}-cloudflared-token", and the default instance_name is k3s-01. If you
# changed it, change `remoteRef.key` below to match — `tofu output vault_secret_names` will
# tell you exactly what to use.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflared-secret
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # ⚠ Your fork, if you forked. scripts/set-gitops-repo.sh rewrites this line for you.
    repoURL: https://github.com/danieliyahu1/oci-k3s-starter.git
    targetRevision: HEAD
    path: kubernetes/optional/manifests/cloudflared-secret
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflared
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
