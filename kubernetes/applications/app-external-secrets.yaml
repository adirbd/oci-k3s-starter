# External Secrets Operator. RUNG 4 ONLY.
#
# ⚠ NOT DEPLOYED UNTIL YOU MOVE IT into kubernetes/applications/, same as the tunnel
# connector — it is useless without the vault and IAM that `enable_vault = true` creates.
#
# WHAT IT DOES: watches ExternalSecret objects, fetches the named values from OCI Vault,
# and writes ordinary Kubernetes Secrets. Your manifests reference a secret NAME; the
# VALUE is fetched at runtime by a machine that proved its own identity. That is what
# makes it safe to commit the manifest to a public repo.
#
# ORDER (it matters — ESO needs the CRDs before the store, and the store before any
# ExternalSecret):
#   1. tofu apply                          (enable_vault = true)
#   2. cp this file into kubernetes/applications/ ; push ; wait for Healthy
#   3. tofu output -raw clustersecretstore_manifest | kubectl apply -f -
#   4. write ExternalSecrets that reference it
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Ahead of anything that consumes a Secret. Waves only order what Argo syncs in one
    # pass, but it costs nothing and makes the intent explicit.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.9.0
    helm:
      values: |
        installCRDs: true

        # Single node, so one of each. The upstream default of 1 replica per component is
        # already right; these are here to pin the memory, which is the budget on this box.
        resources:
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            memory: 192Mi

        webhook:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi

        certController:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The CRDs are large enough to blow the annotation-size limit that client-side apply
      # uses for its last-applied-configuration. Without this the sync fails with
      # `metadata.annotations: Too long`, which reads like a chart bug.
      - ServerSideApply=true
