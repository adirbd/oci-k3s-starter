# The vault entry → the Secret the connector actually reads.
#
# NOTE WHAT IS IN GIT: a NAME, never a value. This file is safe in a public repo — the token
# is fetched at runtime by a machine that proved its own identity to OCI, and never touches
# a laptop, a shell history or this repository.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-token
  namespace: cloudflared
spec:
  # Re-checks hourly. If you rotate the tunnel (which issues a new token) the cluster picks
  # it up without anyone touching kubectl.
  refreshInterval: 1h

  secretStoreRef:
    name: oci-vault # created by `tofu output -raw clustersecretstore_manifest`
    kind: ClusterSecretStore

  target:
    # Must match the secretKeyRef in app-cloudflared.yaml exactly.
    name: cloudflared-token
    creationPolicy: Owner

  data:
    - secretKey: token # the KEY inside the Secret — app-cloudflared reads `token`
      remoteRef:
        # ⚠ "${instance_name}-cloudflared-token" in terraform/vault.tf. Default shown.
        key: k3s-01-cloudflared-token
