# Argo CD's credential for a PRIVATE gitops repo, fetched from OCI Vault. RUNG 4.
#
# ⚠ NOT DEPLOYED UNTIL YOU MOVE IT into kubernetes/applications/, and it does nothing
# without rung 4 (vault + IAM + ClusterSecretStore) and a vault entry you create by hand.
#
# WHY IT EXISTS. Without rung 4, Argo's repo credential is a hand-made plaintext Secret
# (`kubectl create secret ... repo-my-cluster`) with the PAT or GitHub App private key in
# it. It sits in cluster state, is invisible to Git, and is re-typed by hand after every
# rebuild. This closes the loop: the value lives in the vault, the box proves its own
# identity to read it, and the Secret is recreated on its own. There is also a chicken-
# and-egg this cannot cross: Argo cannot read a private repo to fetch the credential that
# unlocks that repo — so unlike most ExternalSecrets this one does NOT arrive from the
# gitops repo. When rung 4 is on, terraform renders it into cloud-init and the box applies
# it at boot (terraform/cloud-init.yaml, argo-repo-secret.yaml). This file exists as the
# durable, inspectable copy and for when you manage it by hand instead.
#
# THE VAULT ENTRY. Put a JSON object in OCI Vault named "<instance_name>-argo-repo"
# (default instance_name is k3s-01 → "k3s-01-argo-repo"). Keys, matching the Secret the
# example in docs/rung-3-your-app.md creates:
#
#   type                    "git"
#   url                     "https://github.com/you/your-cluster.git"
#   githubAppID             "123456"
#   githubAppInstallationID "654321"
#   githubAppPrivateKey     "-----BEGIN RSA PRIVATE KEY-----\n..."
#
# The private key is a multiline value; store it with literal newlines in the JSON.
# If you renamed the box, `tofu output vault_secret_names` prints the real entry name —
# set remoteRef.key to match. (The bootstrap-rendered copy always uses the right name.)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-my-cluster
  namespace: argocd
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore

  target:
    name: repo-my-cluster
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: "{{ .type }}"
        url: "{{ .url }}"
        githubAppID: "{{ .githubAppID }}"
        githubAppInstallationID: "{{ .githubAppInstallationID }}"
        githubAppPrivateKey: "{{ .githubAppPrivateKey }}"

  dataFrom:
    - extract:
        # ⚠ "<instance_name>-argo-repo" — see the note above. Default shown.
        key: k3s-01-argo-repo
