# Everything here has caught a real bug in this repo, or guards one that was caught.
# A check that has never failed is a check nobody trusts — so each job says what it is for.
name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.10.0"

      - name: fmt
        run: tofu -chdir=terraform fmt -check -diff

      # -backend=false: no credentials, no state, no network beyond the provider registry.
      - name: init (no backend)
        run: tofu -chdir=terraform init -backend=false -input=false

      - name: validate
        run: tofu -chdir=terraform validate

      # cloud-init is a TEMPLATE, so `validate` never looks inside it. A `${...}` that
      # Terraform cannot resolve, or YAML that cloud-init cannot parse, fails at apply —
      # by which time you are debugging a box that booted and did nothing.
      - name: cloud-init renders and parses
        run: |
          mkdir -p /tmp/render && cp terraform/cloud-init.yaml /tmp/render/
          # argocd_version comes from variables.tf, not a copy here: renovate bumps the
          # default, and a hardcoded copy silently rendered a version nobody ships.
          # (check-argocd-manifest.py already reads it the same way.)
          ARGOCD_VERSION=$(sed -n '/variable "argocd_version"/,/^}/s/.*default *= *"\(.*\)".*/\1/p' terraform/variables.tf)
          test -n "$ARGOCD_VERSION" || { echo "could not read argocd_version default"; exit 1; }
          cat > /tmp/render/main.tf <<EOF
          output "rendered" {
            value = templatefile("\${path.module}/cloud-init.yaml", {
              k3s_channel      = "stable"
              argocd_version   = "$ARGOCD_VERSION"
              gitops_repo_url  = "https://example.com/repo.git"
              gitops_repo_path = "kubernetes/applications"
              # Vault OFF, the default: grafana arrives as a plaintext Secret, and the
              # vault-dependent files render empty. indent(6,...) matches what instance.tf
              # does (yamlencode + indent), so the value lands correctly under `content: |`.
              grafana_admin_secret = indent(6, "apiVersion: v1\nkind: Secret\nmetadata:\n  name: grafana-admin\n  namespace: observability\ntype: Opaque\nstringData:\n  admin-user: admin\n  admin-password: render-check-only\n")
              argo_repo_secret     = "" # rendered by instance.tf when enable_vault is true
              clustersecretstore   = "" # rendered by instance.tf when enable_vault is true
            })
          }
          EOF
          tofu -chdir=/tmp/render init -backend=false -input=false >/dev/null
          tofu -chdir=/tmp/render apply -auto-approve >/dev/null
          tofu -chdir=/tmp/render output -raw rendered > /tmp/cloud-init.rendered

          python3 - <<'PY'
          import re, sys, yaml
          text = open("/tmp/cloud-init.rendered").read()
          left = re.findall(r"\$\{[^}]*\}", text)
          if left:
              sys.exit(f"unsubstituted placeholders survived: {left}")
          doc = yaml.safe_load(text)
          print("rendered cloud-init OK:",
                len(doc["write_files"]), "write_files,",
                len(doc["runcmd"]), "runcmd entries")
          PY

      # The bootstrap runs unattended on a box you cannot watch. A syntax error there is a
      # server that boots, accepts SSH, and is simply empty.
      # Nothing else in CI runs kubectl, so the one thing that can kill rung 1 outright —
      # an Argo CD manifest too large for a client-side apply — is otherwise invisible
      # until someone boots a real machine.
      - name: argo cd manifest can actually be applied
        run: python3 scripts/check-argocd-manifest.py

      - name: bootstrap script is valid bash
        run: |
          python3 - <<'PY'
          import yaml
          d = yaml.safe_load(open("/tmp/cloud-init.rendered"))
          for f in d["write_files"]:
              if f["path"].endswith(".sh"):
                  open("/tmp/bootstrap.sh", "w").write(f["content"])
          PY
          bash -n /tmp/bootstrap.sh
          echo "bootstrap script parses"

  kubernetes:
    name: kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: "v4.2.4"

      - run: pip install --quiet pyyaml

      # PyYAML keeps the LAST of a duplicated key, so a file with two `resources:` blocks
      # deploys happily and ignores half of what you wrote. Nothing else catches it —
      # least of all inside the embedded Helm values string.
      # examples/ and .github/ too: a template someone copies is code, and shipping a
      # broken one costs the reader more than a broken file in our own tree would.
      - name: no duplicate YAML keys
        run: python3 scripts/check-dup-keys.py kubernetes examples .github

      # THE ONE THAT EARNED ITS PLACE. A values file is a request; only the rendered chart
      # says what happened. This caught two silent bugs on the day it was written —
      # dashboard keys that did not exist, and pruning that pruned nothing.
      - name: applications render, and say what they should
        run: python3 scripts/check-apps.py

      # Oracle's free tier is Ampere. rung 3 warns users at length that an amd64 image dies
      # with `exec format error` — the repo's own stack has to meet the same bar, and a
      # chart bump can introduce an amd64-only image silently.
      - name: every image has an arm64 build
        run: python3 scripts/check-image-arch.py

  scripts:
    name: scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: bash scripts parse
        run: for f in scripts/*.sh; do bash -n "$f" && echo "OK $f"; done

      # The Windows twin cannot be checked on the author's Mac, and shipping an unverified
      # script to the people least able to debug it is how a repo earns a reputation.
      # GitHub's Ubuntu runners have pwsh, so it gets parsed on every push.
      - name: powershell scripts parse
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
            Write-Host "OK $($_.Name)"
          }

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: relative links resolve
        run: python3 scripts/check-links.py

  renovate:
    name: renovate config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Caught a real error the day it was added: JSON5 has no string concatenation, so a
      # description written as 'a' + 'b' is a parse failure — and an unparseable config is
      # a Renovate that opens nothing, silently.
      #
      # ⚠ PIN THE VALIDATOR. `renovate@latest` resolved to a version the registry does not
      # serve, and an unpinned older one rejected `managerFilePatterns` (which replaced
      # `fileMatch`) — i.e. it failed correct config. A stale validator is worse than none.
      - name: validate renovate.json5
        run: npx --yes --package renovate@44.30.4 -- renovate-config-validator .github/renovate.json5

  secrets:
    name: secrets
    runs-on: ubuntu-latest

    # ⚠ pull-requests: read IS REQUIRED, and its absence only shows up on a real PR.
    # On a pull_request event gitleaks calls GET /repos/../pulls/N/commits to scan just the
    # PR's range. The workflow-level `permissions: contents: read` does not cover that, so
    # the action dies with:
    #     403 "Resource not accessible by integration"
    # On a push event it never makes that call — which is why this passed on every direct
    # push to main and failed the moment the first pull request arrived.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans HISTORY; a shallow clone checks almost nothing
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
