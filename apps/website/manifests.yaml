apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: website
spec:
  replicas: 1
  selector:
    matchLabels: { app: website }
  template:
    metadata:
      labels: { app: website }
    spec:
      containers:
        - name: website
          image: ghcr.io/danieliyahu1/daniel-personal-website:sha-681d8b8bf332f8c8a5d8a8954848ce904b9e2351
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: website
  namespace: website
spec:
  selector: { app: website }
  ports:
    - port: 80
      targetPort: 80